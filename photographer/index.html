<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>镜界 · 摄影师作品集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="noise"></div>
    <header class="hero">
      <nav class="nav">
        <div class="logo">镜界</div>
        <div class="nav-actions">
          <span>城市旅行 · 人像 · 胶片氛围</span>
          <button class="ghost">预约拍摄</button>
        </div>
      </nav>
      <div class="hero-content">
        <p class="eyebrow">PHOTOGRAPHER PORTFOLIO</p>
        <h1>
          用光影写故事，
          <span>把瞬间拍成电影。</span>
        </h1>
        <p class="lead">
          我热衷于捕捉城市的呼吸、人像的情绪与旅途的自由感。作品以高对比光影与大胆色彩为标识，让每一次按下快门都成为“情绪的定格”。
        </p>
        <div class="hero-cta">
          <button class="primary">查看精选作品</button>
          <button class="secondary">下载作品集</button>
        </div>
        <div class="stats">
          <div>
            <strong>128</strong>
            <span>城市故事</span>
          </div>
          <div>
            <strong>46</strong>
            <span>旅拍目的地</span>
          </div>
          <div>
            <strong>8</strong>
            <span>合作品牌</span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="gallery">
        <div class="section-head">
          <h2>我的镜头语言</h2>
          <p>
            点击任意作品可放大查看，再次点击即可关闭。每一张照片，都来自真实旅途与街头。
          </p>
        </div>
        <div class="grid">
          <figure class="card" data-full="https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=1400&auto=format&fit=crop">
            <img
              src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=700&auto=format&fit=crop"
              alt="群山与日落的风景"
            />
            <figcaption>
              <h3>日落山脉</h3>
              <span>旅途 · 旷野</span>
            </figcaption>
          </figure>
          <figure class="card" data-full="https://images.unsplash.com/photo-1465101046530-73398c7f28ca?q=80&w=1400&auto=format&fit=crop">
            <img
              src="https://images.unsplash.com/photo-1465101046530-73398c7f28ca?q=80&w=700&auto=format&fit=crop"
              alt="城市街头夜景"
            />
            <figcaption>
              <h3>霓虹城市</h3>
              <span>街头 · 速度</span>
            </figcaption>
          </figure>
          <figure class="card" data-full="https://images.unsplash.com/photo-1467748545584-951fc8f4681b?q=80&w=1400&auto=format&fit=crop">
            <img
              src="https://images.unsplash.com/photo-1467748545584-951fc8f4681b?q=80&w=700&auto=format&fit=crop"
              alt="海边人像剪影"
            />
            <figcaption>
              <h3>海风人像</h3>
              <span>人像 · 情绪</span>
            </figcaption>
          </figure>
          <figure class="card" data-full="https://images.unsplash.com/photo-1482192596544-9eb780fc7f66?q=80&w=1400&auto=format&fit=crop">
            <img
              src="https://images.unsplash.com/photo-1482192596544-9eb780fc7f66?q=80&w=700&auto=format&fit=crop"
              alt="室内人像光影"
            />
            <figcaption>
              <h3>深夜片场</h3>
              <span>影棚 · 细节</span>
            </figcaption>
          </figure>
          <figure class="card" data-full="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?q=80&w=1400&auto=format&fit=crop">
            <img
              src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?q=80&w=700&auto=format&fit=crop"
              alt="人物特写"
            />
            <figcaption>
              <h3>情绪特写</h3>
              <span>人像 · 视线</span>
            </figcaption>
          </figure>
          <figure class="card" data-full="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1400&auto=format&fit=crop">
            <img
              src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=700&auto=format&fit=crop"
              alt="城市建筑视角"
            />
            <figcaption>
              <h3>建筑协奏</h3>
              <span>建筑 · 结构</span>
            </figcaption>
          </figure>
        </div>
      </section>

      <section class="contact">
        <div class="contact-card">
          <h2>一起创造下一次快门心跳</h2>
          <p>
            无论是旅拍、人像、品牌或私人定制项目，都欢迎留言描述你的故事。
          </p>
          <div class="contact-actions">
            <button class="primary">发送拍摄需求</button>
            <button class="ghost">查看合作价目</button>
          </div>
        </div>
      </section>
    </main>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lightbox-content">
        <img id="lightbox-image" alt="放大查看的作品" />
        <p>点击任意区域关闭</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
